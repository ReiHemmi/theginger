  <style>
    :root {
      --gold:    #C9A017;
      --gold-dp: #B08D10;
      --gold-lt: rgba(201,160,23,.14);
      --dark:    #0C0C0C;
      --cream:   #FAF8F3;
      --ink:     #1A1A1A;
      --mid:     #5A5856;
      --light:   #8A8580;
      --serif:   'Noto Serif JP','Hiragino Mincho ProN','Yu Mincho',serif;
      --sans:    'Noto Sans JP','Hiragino Kaku Gothic ProN',sans-serif;
      --latin:   'Cormorant Garamond',serif;
    }
    *, *::before, *::after { box-sizing:border-box; margin:0; padding:0; }
    body {
      background:var(--cream); color:var(--ink);
      font-family:var(--sans); font-size:15px; line-height:1.85;
      -webkit-font-smoothing:antialiased;
      min-height:100vh; display:flex; align-items:center; justify-content:center;
      padding:40px 20px;
    }
    .card {
      width:100%; max-width:460px; text-align:center;
      background:#fff; border:1px solid #ece6d8; border-radius:16px;
      padding:52px 36px 44px;
      box-shadow:0 18px 50px rgba(26,24,18,.07);
    }

    .check {
      width:60px; height:60px; margin:0 auto 26px;
      border-radius:50%; background:var(--gold);
      display:flex; align-items:center; justify-content:center;
      box-shadow:0 6px 18px rgba(201,160,23,.35);
    }
    .check svg { width:28px; height:28px; }

    .ey {
      display:block; font-family:var(--latin);
      font-size:12px; font-weight:400; letter-spacing:.34em;
      text-transform:uppercase; color:var(--gold-dp); margin-bottom:12px;
    }
    .rule { width:38px; height:1px; background:var(--gold); margin:0 auto 24px; }

    h1 {
      font-family:var(--serif); font-weight:500;
      font-size:clamp(20px,5vw,24px); letter-spacing:.05em;
      line-height:1.7; color:var(--ink); margin-bottom:24px;
    }
    p { font-size:14px; line-height:1.95; color:var(--mid); margin-bottom:15px; }
    p.lead { color:var(--ink); }
    .ship {
      display:inline-block; margin:6px auto 4px; padding:10px 20px;
      background:var(--gold-lt); border-radius:999px;
      font-family:var(--serif); font-size:13.5px; color:var(--gold-dp);
      letter-spacing:.04em;
    }

    .btn {
      display:inline-block; margin-top:26px;
      padding:15px 42px; background:var(--gold); color:var(--dark);
      font-family:var(--serif); font-size:15px; font-weight:500;
      letter-spacing:.08em; border-radius:2px; transition:opacity .2s;
    }
    .btn:hover { opacity:.88; }

    .brand {
      margin-top:34px; font-family:var(--latin);
      font-size:13px; letter-spacing:.32em; text-transform:uppercase;
      color:var(--light);
    }
  </style>
</head>
<body>
  <main class="card">
    <div class="check" aria-hidden="true">

              stroke-linecap="round" stroke-linejoin="round"/>

    <span class="ey">Thank You</span>
    <div class="rule"></div>

    <h1>ご注文ありがとうございます</h1>

    <p class="lead">このたびは THE GINGER をお選びいただき、<br>心より御礼申し上げます。</p>

    <span class="ship">お届け予定 ― 2026年7月末ごろ</span>

    <p>準備の様子や入荷の進捗は、<br>メールマガジンでも随時お届けしてまいります。<br>どうぞ楽しみにお待ちくださいませ。</p>

    <a class="btn" href="https://reihemmi.github.io/theginger/">トップへ戻る</a>

    <div class="brand">THE GINGER</div>
  </main>
</body>
